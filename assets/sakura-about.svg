<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
<defs>
  <radialGradient id="glow" cx="50%" cy="42%" r="58%">
    <stop offset="0" stop-color="#e9a6b8" stop-opacity=".22"/>
    <stop offset=".55" stop-color="#e9a6b8" stop-opacity=".06"/>
    <stop offset="1" stop-color="#070707" stop-opacity="0"/>
