  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".025"/>
    <stop offset="1" stop-color="#e9a6b8" stop-opacity=".10"/>
  </linearGradient>
</defs>
<rect width="900" height="1100" fill="#070707"/>
<rect width="900" height="1100" fill="url(#glow)"/>

